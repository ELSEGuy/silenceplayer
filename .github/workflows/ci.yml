name: CI

on:
  push:
    branches: [master, "v*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Check the code (ruff)
        run: python -m ruff check .
      - name: Run tests
        run: python -m pytest -q

  build:
    # Every push (not pull requests) builds the app folder, the portable zip
    # and the installer; download them from the run's "Artifacts".
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build
        shell: pwsh
        run: ./build.ps1 -SkipTests -Installer
      - uses: actions/upload-artifact@v4
        with:
          name: silenceplayer-build
          if-no-files-found: error
          path: |
            dist/SilencePlayer-Setup-*.exe
            dist/SilencePlayer-*-portable.zip
            dist/SHA256SUMS.txt
            dist/build-freeze.txt

  release:
    # Pushing a tag like v1.4.0 creates a DRAFT release with the installer,
    # the portable zip and the checksums attached, and the notes taken from
    # CHANGELOG.md. Nothing is public until you click Publish on GitHub.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: silenceplayer-build
          path: dist
      - name: Check that the tag matches APP_VERSION
        run: |
          app=$(python3 -c "import re; print(re.search(r'APP_VERSION\s*=\s*\"([^\"]+)\"', open('silenceplayer/__init__.py').read()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$app" != "$tag" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but APP_VERSION in silenceplayer/__init__.py is $app"
            exit 1
          fi
      - name: Release notes from CHANGELOG.md
        run: python3 tools/release_notes.py "${GITHUB_REF_NAME#v}" > notes.md
      - name: Create the draft release (or add the files to an existing one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          files=(dist/SilencePlayer-Setup-*.exe dist/SilencePlayer-*-portable.zip dist/SHA256SUMS.txt)
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --draft --title "Silence Player $tag" --notes-file notes.md
          fi
